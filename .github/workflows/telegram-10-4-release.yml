name: K9 API 10.4 controlled release
on:
  push:
    branches: [upgrade/telegram-10-4]
    paths:
      - .github/workflows/telegram-10-4-release.yml
      - scripts/release-*.mjs
      - scripts/test-release-*.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k9-production-upgrade
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployment safety checks
        run: node scripts/test-release-preflight.mjs
      - name: Inspect Cloudflare access and current production metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
        run: node scripts/release-preflight.mjs
      - name: Preserve safe deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: k9-release-preflight
          path: ${{ runner.temp }}/k9-release-report/preflight.json
          retention-days: 7
          if-no-files-found: error
  verify-and-backup:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-release-cloudflare.mjs
      - run: node --experimental-strip-types scripts/test-release-preview.mjs
      - run: node scripts/test-release-production.mjs
      - run: node scripts/test-release-public.mjs
      - name: Lint release scripts
        run: pnpm exec eslint scripts/release-*.mjs scripts/test-release-*.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - name: Python regression tests
        run: |
          python3 scripts/test_bot.py
          python3 scripts/test_hosting.py
          python3 scripts/test_local_hosting.py
          python3 scripts/test_emoji_manager.py
          python3 scripts/test_widget_migration.py
          python3 scripts/test-release-backup.py
      - run: pnpm build
      - run: pnpm test:api
        id: integration
      - name: Export production D1 and verify a private restored backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
        run: node scripts/release-backup.mjs
      - name: Verify the isolated Worker and a private owner Widget
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
        run: node --experimental-strip-types scripts/release-stage.mjs
      - name: Deploy the verified compatibility release and check live traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
          K9_RELEASE_PRODUCTION: '1'
        run: node scripts/release-production.mjs
      - name: Preserve safe backup metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9-release-backup-metadata
          path: |
            ${{ runner.temp }}/k9-release-report/backup.json
            ${{ runner.temp }}/k9-release-report/staging.json
            ${{ runner.temp }}/k9-release-report/deployment.json
          retention-days: 7
          if-no-files-found: warn
