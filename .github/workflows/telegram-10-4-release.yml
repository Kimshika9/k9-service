name: K9 API 10.4 controlled release
on:
  push:
    branches: [upgrade/telegram-10-4]
    paths:
      - .github/workflows/telegram-10-4-release.yml
      - scripts/release-*.mjs
      - scripts/test-release-*.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k9-production-upgrade
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployment safety checks
        run: node scripts/test-release-preflight.mjs
      - name: Inspect Cloudflare access and current production metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
        run: node scripts/release-preflight.mjs
      - name: Preserve safe deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: k9-release-preflight
          path: ${{ runner.temp }}/k9-release-report/preflight.json
          retention-days: 7
          if-no-files-found: error
