name: Verify released K9 Service
on:
  workflow_run:
    workflows: [Check K9 Service]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the live release after main branch verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {setTimeout as pause} from 'node:timers/promises';
          import {inspectRelease} from './scripts/release-preflight.mjs';
          import {publicProbe} from './scripts/release-public-probe.mjs';
          import {cloudflare} from './scripts/release-cloudflare.mjs';
          const credentials={token:process.env.CLOUDFLARE_API_TOKEN,accountId:process.env.CLOUDFLARE_ACCOUNT_ID};
          const observations=[];
          for(let i=0;i<3;i++){
            if(i)await pause(10000);
            const metadata=await inspectRelease(credentials);
            const checks=await publicProbe();
            const observation={productionVersions:metadata.productionVersions,widgetsEnabled:metadata.widgetsEnabled,checks};
            observations.push(observation);
            if(!metadata.widgetsEnabled||checks.rootStatus!==200||checks.assetStatus!==200||checks.healthStatus!==200||!checks.health?.ready||checks.health.checks?.widgets!==true||checks.unauthorizedStatus!==401)throw new Error('Post-main production readiness verification failed: '+JSON.stringify(observation));
          }
          // Read coarse recorded health only. Never claim/ack jobs, synthesize a
          // heartbeat, expose owner IDs or read project names/secrets/logs.
          const metadata=await inspectRelease(credentials),api=cloudflare(credentials);
          const result=await api(`d1/database/${metadata.databaseId}/query`,{method:'POST',label:'read-only hosting observation',body:{sql:'SELECT runtime,projects,running,unknown,received_at FROM hosting_health ORDER BY received_at DESC LIMIT 1'}});
          const row=result[0]?.results?.[0],received=Number(row?.received_at),age=Date.now()-received;
          const counts=row?Object.fromEntries(['projects','running','unknown'].map(key=>[key,Number.isSafeInteger(row[key])&&row[key]>=0?row[key]:null])):{};
          const valid=row&&['local','docker','bot-hosting'].includes(row.runtime)&&Object.values(counts).every(value=>value!==null)&&counts.running+counts.unknown<=counts.projects;
          const hostingObservation=row?{recorded:true,runtime:valid?row.runtime:'unknown',...counts,observedAt:Number.isFinite(received)?new Date(received).toISOString():null,fresh:!!valid&&age>=0&&age<=120000}:{recorded:false};
          const directory=process.env.K9_RELEASE_REPORT_DIR;
          await fs.mkdir(directory,{recursive:true,mode:0o700});
          await fs.writeFile(path.join(directory,'post-main.json'),JSON.stringify({source:process.env.GITHUB_SHA,observations,hostingObservation},null,2),{mode:0o600});
          console.log(JSON.stringify({source:process.env.GITHUB_SHA,observations,hostingObservation},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: k9-post-main-readiness
          path: ${{ runner.temp }}/k9-release-report/post-main.json
          retention-days: 7
          if-no-files-found: error
