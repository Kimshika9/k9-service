name: Verify released K9 Service
on:
  workflow_run:
    workflows: [Check K9 Service]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the live release after main branch verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K9_RELEASE_REPORT_DIR: ${{ runner.temp }}/k9-release-report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {setTimeout as pause} from 'node:timers/promises';
          import {inspectRelease} from './scripts/release-preflight.mjs';
          import {publicProbe} from './scripts/release-public-probe.mjs';
          const observations=[];
          for(let i=0;i<3;i++){
            if(i)await pause(10000);
            const metadata=await inspectRelease({token:process.env.CLOUDFLARE_API_TOKEN,accountId:process.env.CLOUDFLARE_ACCOUNT_ID});
            const checks=await publicProbe();
            if(!metadata.widgetsEnabled||checks.rootStatus!==200||checks.assetStatus!==200||checks.healthStatus!==200||!checks.health?.ready||checks.health.checks?.widgets!==true||checks.unauthorizedStatus!==401)throw new Error('Post-main production readiness verification failed.');
            observations.push({productionVersions:metadata.productionVersions,widgetsEnabled:metadata.widgetsEnabled,checks});
          }
          const directory=process.env.K9_RELEASE_REPORT_DIR;
          await fs.mkdir(directory,{recursive:true,mode:0o700});
          await fs.writeFile(path.join(directory,'post-main.json'),JSON.stringify({source:process.env.GITHUB_SHA,observations},null,2),{mode:0o600});
          console.log(JSON.stringify({source:process.env.GITHUB_SHA,observations},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: k9-post-main-readiness
          path: ${{ runner.temp }}/k9-release-report/post-main.json
          retention-days: 7
          if-no-files-found: error
